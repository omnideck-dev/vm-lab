#cloud-config
hostname: omnideck-deb
manage_etc_hosts: true
timezone: America/Chicago

users:
  - name: tester
    gecos: OmniDeck Release Tester
    groups: [adm, sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: false
    passwd: "$6$SRTdHbBlz5uKrH7M$bIpFx8CSO1te/doj.Tk445gUl7SzvU8./gnsmJHIpd9U/9850k/QNRQYtS8pvn8/N061rjBi9xvBnp1UAUHBJ."
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBtgEDHDtGv8c9hkTV4D2U1RuLha5n1YvfqxlTd5tAqv omnideck-release-lab

ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages:
  - task-gnome-desktop
  - spice-vdagent
  - qemu-guest-agent
  - openssh-server
  - policykit-1
  - curl
  - jq
  - ca-certificates
  - xdg-utils
  - firefox-esr

write_files:
  - path: /usr/local/sbin/omnideck-configure-firefox
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      if ! command -v firefox >/dev/null 2>&1 && command -v firefox-esr >/dev/null 2>&1; then
        ln -s "$(command -v firefox-esr)" /usr/local/bin/firefox
      fi
      firefox_bin="$(command -v firefox || true)"
      [[ -n "$firefox_bin" ]] || {
        printf 'Firefox was not installed by the Debian guest recipe.\n' >&2
        exit 1
      }

      desktop_entry=/var/lib/snapd/desktop/applications/firefox_firefox.desktop
      install -d -m 0755 "$(dirname "$desktop_entry")"
      if [[ ! -e "$desktop_entry" ]]; then
        cat > "$desktop_entry" <<EOF
      [Desktop Entry]
      Name=Firefox
      Comment=Web Browser
      Exec=${firefox_bin} %u
      Terminal=false
      Type=Application
      MimeType=x-scheme-handler/http;x-scheme-handler/https;text/html;
      Categories=Network;WebBrowser;
      StartupNotify=true
      EOF
      fi
      if [[ -w /usr/share/applications ]]; then
        install -m 0644 "$desktop_entry" /usr/share/applications/firefox_firefox.desktop
        if command -v update-desktop-database >/dev/null 2>&1; then
          update-desktop-database /usr/share/applications || true
        fi
      fi

      install -d -o tester -g tester /home/tester/.config
      cat > /home/tester/.config/mimeapps.list <<'EOF'
      [Default Applications]
      x-scheme-handler/http=firefox_firefox.desktop
      x-scheme-handler/https=firefox_firefox.desktop
      text/html=firefox_firefox.desktop
      EOF
      chown tester:tester /home/tester/.config/mimeapps.list

runcmd:
  - [bash, -lc, "apt-get remove -y podman || true"]
  - [bash, -lc, "/usr/local/sbin/omnideck-configure-firefox"]
  - [bash, -lc, "install -d -o tester -g tester /home/tester/.config && touch /home/tester/.config/gnome-initial-setup-done && chown tester:tester /home/tester/.config/gnome-initial-setup-done"]
  - [systemctl, set-default, graphical.target]
  - [systemctl, enable, gdm3]
  - [systemctl, enable, ssh]
  - [systemctl, enable, qemu-guest-agent]
  - [touch, /var/lib/omnideck-lab-ready]

power_state:
  mode: reboot
  timeout: 30
  condition: true

final_message: "OmniDeck DEB guest provisioning complete"

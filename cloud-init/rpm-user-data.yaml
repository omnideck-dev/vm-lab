#cloud-config
hostname: omnideck-rpm
manage_etc_hosts: true
timezone: America/Chicago

users:
  - name: tester
    gecos: OmniDeck Release Tester
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: false
    passwd: "$6$SRTdHbBlz5uKrH7M$bIpFx8CSO1te/doj.Tk445gUl7SzvU8./gnsmJHIpd9U/9850k/QNRQYtS8pvn8/N061rjBi9xvBnp1UAUHBJ."
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBtgEDHDtGv8c9hkTV4D2U1RuLha5n1YvfqxlTd5tAqv omnideck-release-lab

ssh_pwauth: false
disable_root: true
package_update: true
package_upgrade: true
packages:
  - qemu-guest-agent
  - spice-vdagent
  - openssh-server
  - curl
  - jq
  - ca-certificates
  - xdg-utils

runcmd:
  - [bash, -lc, "dnf -y group install workstation-product-environment"]
  - [bash, -lc, "dnf -y remove podman || true"]
  - [bash, -lc, "install -d -o tester -g tester /home/tester/.config && touch /home/tester/.config/gnome-initial-setup-done && chown tester:tester /home/tester/.config/gnome-initial-setup-done"]
  - [systemctl, set-default, graphical.target]
  - [systemctl, enable, gdm]
  - [systemctl, enable, sshd]
  - [systemctl, enable, qemu-guest-agent]
  - [touch, /var/lib/omnideck-lab-ready]

power_state:
  mode: reboot
  timeout: 30
  condition: true

final_message: "OmniDeck RPM guest provisioning complete"
